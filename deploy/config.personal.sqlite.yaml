# =============================================================================
# 个人自用精简配置（1C1G / 无 Docker / SQLite / 无外部 Redis）
# 用法：复制到数据目录，例如 /opt/sub2api/data/config.yaml
# 修改 jwt.secret、admin 密码后再启动
# =============================================================================

# standard（推荐）：分组隔离、用量扣费、用量/审计页面都完整可用。
# simple 会跳过计费**并且忽略分组调度**（分组配置填了也不生效），只在完全不看账时才用。
# 觉得菜单太多不必降级：用管理页「菜单管理」(/admin/menu) 逐项隐藏。
run_mode: "standard"

server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"
  # 降低连接与头大小占用（个人够用）
  read_header_timeout: 10
  idle_timeout: 60
  max_request_body_size: 33554432   # 32MB，够普通对话；大文件再调大
  h2c:
    enabled: false

database:
  driver: "sqlite"
  path: "/opt/sub2api/data/sub2api.db"
  # WAL 下的提交耐久度。normal（默认）不会损坏数据库，进程崩溃也不丢数据，
  # 只有操作系统崩溃/断电才可能丢掉最近几个已提交事务。
  # full 则每次提交都 fsync；慢盘 VPS 上实测单次 fsync 约 5.8ms，且是在持有
  # SQLite 单写者锁时付出的，直接压住写入吞吐。要按事务级耐久度换性能就改 full。
  synchronous: "normal"
  max_open_conns: 2
  max_idle_conns: 2
  conn_max_lifetime_minutes: 30
  conn_max_idle_time_minutes: 5
  # 个人用关掉配额 flusher
  user_platform_quota_flusher_enabled: false

redis:
  enabled: false
  host: ""
  port: 6379
  dial_timeout_seconds: 5
  read_timeout_seconds: 3
  write_timeout_seconds: 3
  pool_size: 8
  min_idle_conns: 0

# 运维：API 与错误/系统日志可用；聚合/采集缓存仍关以省资源
# 定时清理默认开：系统日志与错误日志共用 error_log_retention_days
ops:
  enabled: true
  use_preaggregated_tables: false
  cleanup:
    enabled: true
    schedule: "0 3 * * *"              # 每天 03:00（时区见下方 timezone）
    error_log_retention_days: 7        # 错误日志 + 系统日志保留天数；0=每次清空
    minute_metrics_retention_days: 3
    hourly_metrics_retention_days: 14
  aggregation:
    enabled: false
  metrics_collector_cache:
    enabled: false

# 批量生图队列默认关
batch_image:
  enabled: false
  queue_enabled: false

jwt:
  secret: "CHANGE_ME_openssl_rand_hex_32"
  expire_hour: 168

# 2FA(TOTP) 与支付 resume token 的 AES-256 密钥，必须是 32 字节 hex（64 位）
# 留空则每次启动随机生成：重启后已绑定的 2FA 全部失效，支付 resume token 也不可用
# 换掉这个值 = 作废所有已绑定的 2FA，部署后不要再改
totp:
  encryption_key: "CHANGE_ME_totp_hex_32"

timezone: "Asia/Shanghai"

default:
  admin_email: "admin@example.com"
  admin_password: "CHANGE_ME_STRONG_PASSWORD"
  user_concurrency: 10
  # 管理员（以及新注册用户）的初始余额。standard 模式会校验余额：
  # 留 0 则首次调 API 直接 403 INSUFFICIENT_BALANCE。
  # 要开放注册就改回 0，再到 /admin/users 单独给自己充。
  user_balance: 100000
  api_key_prefix: "sk-"
  rate_multiplier: 1.0

log:
  level: "warn"   # 个人用可 info/warn，少打日志也省一点 IO

# 网关侧可按需再收紧（示例：不要开过大的并发池）
# gateway:
#   concurrency_slot_ttl_minutes: 30
